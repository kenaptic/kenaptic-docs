site_name: Kenaptic Docs
site_description: How Kenaptic connects your fragmented content and keeps the cross-links fresh.
site_url: https://www.kenaptic.com/docs/
docs_dir: docs
site_dir: site
use_directory_urls: true
copyright: © Kenaptic

theme:
  name: material
  language: en
  logo: assets/logo.png
  favicon: assets/logo.png
  font:
    text: Inter
    code: JetBrains Mono
  # Dark-first, matching the Kenaptic brand (Canvas #0A0F14). Light remains a toggle.
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to light
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow

extra_css:
  - assets/brand.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  # Renders :material-*: / :octicons-*: shortcodes as inline SVG icons (used on the home cards).
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/solid/globe
      link: https://www.kenaptic.com
  generator: false

nav:
  - Why Kenaptic: index.md
  - Introduction:
      - How it works: introduction/how.md
      - What Kenaptic does: introduction/what.md
  - Getting started:
      - Your workspace: getting-started/workspace.md
      - Connect a source: getting-started/connect-a-source.md
      - The review loop: getting-started/the-review-loop.md
  - Using Kenaptic:
      - Discover your estate: guide/discover.md
      - Find gaps & contradictions: guide/gaps-and-contradictions.md
      - Review & publish links: guide/review-and-publish.md
      - Where cross-links are delivered: guide/where-links-are-delivered.md
      - Be found by AI: guide/ai-readiness.md
      - Measure the impact: guide/measure.md
      - Cross-link notifications: guide/notifications.md
      - Contribute to projects you don't own: guide/contributing-upstream.md
      - Settings & account: guide/settings.md
  - Concepts:
      - How linking stays safe: concepts/safe-by-design.md
      - When Kenaptic says no: guide/when-kenaptic-says-no.md
      - Glossary: concepts/glossary.md
  - FAQ: faq.md
